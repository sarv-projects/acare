# Bayesian probability map — admin-defined prior for tool placement.
# All values clamped to [0.05, 0.90] after every Bayesian update.
# Edit before a demo to reflect expected tool positions on the tray.
#
# Classes match trained YOLOv11 model (6 classes):
#   cream, medical scissors, oxymeter, plaster, surgical forceps, thermometer

zone_A:   # left side of tray
  cream:            0.20
  medical scissors: 0.15
  oxymeter:         0.10
  plaster:          0.15
  surgical forceps: 0.20
  thermometer:      0.20

zone_B:   # centre of tray
  cream:            0.15
  medical scissors: 0.25
  oxymeter:         0.20
  plaster:          0.15
  surgical forceps: 0.15
  thermometer:      0.10

zone_C:   # right side of tray
  cream:            0.10
  medical scissors: 0.10
  oxymeter:         0.25
  plaster:          0.25
  surgical forceps: 0.10
  thermometer:      0.20
